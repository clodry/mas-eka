<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Панорама Санкт-Петербурга">
  <!--
    Композиция подчинена вёрстке первого экрана: город стоит в верхних двух
    третях, а нижняя треть — открытое светлое пространство, уходящее в белый.
    Там ложится текст героя (левый нижний угол), поэтому под ним не должно
    быть ни линий крыш, ни шпилей — иначе тёмный заголовок читается по
    «рваному» фону. Верх кадра тоже оставлен пустым: там проходит шапка.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad5ff"/>
      <stop offset="0.26" stop-color="#c2e5ff"/>
      <stop offset="0.48" stop-color="#e2f2ff"/>
      <stop offset="0.63" stop-color="#f4faff"/>
      <stop offset="0.75" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.74" cy="0.14" r="0.55">
      <stop offset="0" stop-color="#fff8e6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffeecd" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6e2f9"/>
      <stop offset="1" stop-color="#e9f4fe"/>
    </linearGradient>

    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec1ec"/>
      <stop offset="0.72" stop-color="#b6daf6"/>
      <stop offset="1" stop-color="#d9ecfc"/>
    </linearGradient>

    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66a4da"/>
      <stop offset="0.7" stop-color="#93c1ea"/>
      <stop offset="1" stop-color="#c1dcf5"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf95"/>
      <stop offset="1" stop-color="#f5b455"/>
    </linearGradient>

    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Облака рисуем размытыми пятнами: чёткие эллипсы читались бы как
         геометрия, а не как небо. -->
    <filter id="haze" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <pattern id="winFar" x="0" y="0" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="8" y="10" width="10" height="15" rx="4" fill="#ffffff" opacity="0.5"/>
    </pattern>
    <pattern id="winMid" x="0" y="0" width="30" height="38" patternUnits="userSpaceOnUse">
      <rect x="9" y="10" width="12" height="18" rx="5" fill="#ffffff" opacity="0.6"/>
    </pattern>
    <pattern id="winNear" x="0" y="0" width="38" height="46" patternUnits="userSpaceOnUse">
      <rect x="11" y="12" width="16" height="23" rx="6" fill="#ffffff" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- ===== Небо ===== -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <g fill="#ffffff" opacity="0.62" filter="url(#haze)">
    <ellipse cx="540" cy="132" rx="200" ry="24"/>
    <ellipse cx="690" cy="188" rx="140" ry="16"/>
    <ellipse cx="1010" cy="106" rx="170" ry="21"/>
    <ellipse cx="1420" cy="196" rx="180" ry="23"/>
    <ellipse cx="140" cy="238" rx="128" ry="16"/>
  </g>

  <!-- ===== Дальний план ===== -->
  <g fill="url(#far)">
    <rect x="0" y="502" width="1600" height="60"/>
    <rect x="52" y="472" width="128" height="34"/>
    <rect x="198" y="482" width="92" height="24"/>
    <rect x="466" y="466" width="152" height="40"/>
    <rect x="700" y="480" width="112" height="26"/>
    <rect x="904" y="462" width="172" height="44"/>
    <rect x="1128" y="476" width="122" height="30"/>
    <rect x="1332" y="468" width="180" height="38"/>
    <polygon points="52,472 116,448 180,472"/>
    <polygon points="466,466 542,438 618,466"/>
    <polygon points="904,462 990,432 1076,462"/>
    <polygon points="1332,468 1422,440 1512,468"/>
    <polygon points="1256,480 1262,392 1268,480"/>
    <polygon points="840,482 846,404 852,482"/>
  </g>
  <rect x="0" y="502" width="1600" height="60" fill="url(#winFar)" opacity="0.45"/>

  <!-- ===== Средний план: доминанты ===== -->
  <g fill="url(#mid)">

    <!-- Петропавловский собор -->
    <rect x="214" y="492" width="150" height="70"/>
    <rect x="258" y="416" width="62" height="82"/>
    <rect x="270" y="356" width="38" height="64"/>
    <polygon points="270,356 289,322 308,356"/>
    <polygon points="285,320 289,214 293,320"/>

    <!-- Казанская колоннада -->
    <rect x="406" y="518" width="256" height="44"/>
    <rect x="406" y="506" width="256" height="14"/>
    <g>
      <rect x="418" y="520" width="9" height="42"/>
      <rect x="448" y="520" width="9" height="42"/>
      <rect x="478" y="520" width="9" height="42"/>
      <rect x="508" y="520" width="9" height="42"/>
      <rect x="538" y="520" width="9" height="42"/>
      <rect x="568" y="520" width="9" height="42"/>
      <rect x="598" y="520" width="9" height="42"/>
      <rect x="628" y="520" width="9" height="42"/>
    </g>

    <!-- Исаакиевский собор -->
    <rect x="672" y="494" width="240" height="68"/>
    <rect x="696" y="468" width="192" height="30"/>
    <rect x="734" y="384" width="116" height="88"/>
    <path d="M734 386 C 734 306, 776 268, 792 268 C 808 268, 850 306, 850 386 Z"/>
    <rect x="781" y="236" width="22" height="36"/>
    <path d="M781 238 C 781 216, 803 216, 803 238 Z"/>
    <rect x="789" y="204" width="6" height="24"/>
    <rect x="684" y="436" width="28" height="40"/>
    <rect x="872" y="436" width="28" height="40"/>
    <polygon points="684,436 698,410 712,436"/>
    <polygon points="872,436 886,410 900,436"/>

    <!-- Адмиралтейство -->
    <rect x="1078" y="498" width="228" height="64"/>
    <rect x="1158" y="430" width="66" height="72"/>
    <rect x="1172" y="382" width="38" height="52"/>
    <polygon points="1172,382 1191,352 1210,382"/>
    <polygon points="1187,350 1191,236 1195,350"/>

    <!-- дальняя классика справа -->
    <rect x="1338" y="506" width="226" height="56"/>
    <rect x="1366" y="478" width="60" height="32"/>
    <polygon points="1366,478 1396,454 1426,478"/>
  </g>

  <g opacity="0.5">
    <rect x="672" y="494" width="240" height="68" fill="url(#winMid)"/>
    <rect x="1078" y="498" width="228" height="64" fill="url(#winMid)"/>
    <rect x="1338" y="506" width="226" height="56" fill="url(#winMid)"/>
    <rect x="214" y="492" width="150" height="70" fill="url(#winMid)"/>
  </g>

  <!-- колонны барабана Исаакия -->
  <g fill="#ffffff" opacity="0.4">
    <rect x="744" y="396" width="7" height="70"/>
    <rect x="765" y="396" width="7" height="70"/>
    <rect x="786" y="396" width="7" height="70"/>
    <rect x="807" y="396" width="7" height="70"/>
    <rect x="828" y="396" width="7" height="70"/>
  </g>

  <!-- ===== Золотые акценты ===== -->
  <g fill="url(#gold)">
    <polygon points="286,214 289,132 292,214"/>
    <circle cx="289" cy="127" r="6"/>
    <rect x="287.5" y="106" width="3" height="20"/>

    <path d="M741 384 C 741 312, 779 276, 792 276 C 805 276, 843 312, 843 384 Z" opacity="0.88"/>
    <rect x="789" y="198" width="6" height="32"/>
    <rect x="781" y="207" width="22" height="5"/>

    <polygon points="1188,350 1191,254 1194,350"/>
    <path d="M1181 246 L1201 246 L1191 237 Z"/>
    <rect x="1189.5" y="220" width="3" height="20"/>
  </g>

  <!-- ===== Ближний план справа ===== -->
  <g fill="url(#near)">
    <rect x="1046" y="562" width="554" height="76"/>
    <rect x="1078" y="536" width="176" height="30"/>
    <polygon points="1078,536 1166,508 1254,536"/>
    <rect x="1320" y="542" width="148" height="26"/>
    <rect x="1498" y="456" width="24" height="110"/>
    <rect x="1490" y="444" width="40" height="15"/>
    <path d="M1501 442 C 1501 424, 1519 424, 1519 442 Z"/>
  </g>
  <rect x="1046" y="562" width="554" height="76" fill="url(#winNear)" opacity="0.45"/>

  <!-- ===== Нева: набережная и блики ===== -->
  <g>
    <rect x="0" y="638" width="1600" height="10" fill="#8dbde8" opacity="0.62"/>
    <g fill="#ffffff" opacity="0.5">
      <rect x="120" y="668" width="180" height="4" rx="2"/>
      <rect x="380" y="686" width="120" height="4" rx="2"/>
      <rect x="600" y="662" width="220" height="4" rx="2"/>
      <rect x="880" y="692" width="150" height="4" rx="2"/>
      <rect x="300" y="706" width="240" height="4" rx="2"/>
      <rect x="1120" y="672" width="190" height="4" rx="2"/>
    </g>
  </g>

  <!-- ===== Растворение низа в белый: зона текста ===== -->
  <rect x="0" y="580" width="1600" height="320" fill="url(#bottomFade)"/>
</svg>
